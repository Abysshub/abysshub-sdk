[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "abysshub"
version = "0.0.0"
description = "Run a hosted tool, an Abyss Widget, from your own Python code and get its result and files. The official library for the Abyss API."
keywords = [
    "abyss",
    "abysshub",
    "widget",
    "run",
    "hosted tools",
    "python tools",
    "automation",
    "file upload",
    "api client",
    "sdk",
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["httpx>=0.27,<1"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.scripts]
abysshub = "abysshub._command:main"

[project.optional-dependencies]
dev = ["deptry", "pytest", "ruff", "vulture"]

[project.urls]
Homepage = "https://abysshub.com/docs#api"
Documentation = "https://abysshub.com/docs"
Source = "https://github.com/Abysshub/abysshub-sdk"
Issues = "https://github.com/Abysshub/abysshub-sdk/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

# The dead-code checks, run by tests/test_package.py. vulture's whitelist is today's
# findings, recorded so only a new one fails; it only shrinks.
[tool.vulture]
paths = ["src", "tests", "vulture_whitelist.py"]
min_confidence = 80

[tool.deptry]
pep621_dev_dependency_groups = ["dev"]

[tool.ruff.lint]
select = ["ERA001"]
